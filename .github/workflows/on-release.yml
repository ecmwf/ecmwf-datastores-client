name: On-release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

concurrency:
  group: on-release

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false

    - name: Building the distribution and verify import
      working-directory: ${{ github.repository }}
      run: make build
    - name: Upload distribution
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: ${{ github.repository }}/dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: 'true' # Enable/disable PyPI publishing
    permissions:
      id-token: write
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/p/ecmwf-datastores-client
    steps:
    - name: Download distribution
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Attest build provenance
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373   # v4.1.1
      with:
        subject-path: dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b   # v1.14.0
      with:
        verbose: true

  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: 'true' # Enable/disable GitHub Pages deployment
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@9761c2d0f98d6dcd8a073b9bb096b3a96e4d1c76 # v1.3
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false

    - name: Build the Sphinx documentation
      working-directory: ${{ github.repository }}
      run: make docs-build
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ github.repository }}/docs/_build/html/

  docs-deploy:
    name: Deploy Documentation
    needs: [docs-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128   # v5.0.0
      id: deployment
