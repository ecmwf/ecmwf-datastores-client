name: On-push

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - upstream
  pull_request:
    branches:
    - main
    - upstream

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@c7c1c9e8f6c4d783c8cdffc4b4b2412ae23e7db3 # v2.0
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Run code quality tools
      working-directory: ${{ github.repository }}
      run: make qa

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@c7c1c9e8f6c4d783c8cdffc4b4b2412ae23e7db3 # v2.0
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Test the code with pytest
      working-directory: ${{ github.repository }}
      run: make unit-tests PYTHON_VERSION=${{ matrix.python-version }}

  type-check:
    name: Type Check
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@c7c1c9e8f6c4d783c8cdffc4b4b2412ae23e7db3 # v2.0
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Static type checking with mypy
      working-directory: ${{ github.repository }}
      run: make type-check

  docs-build:
    name: Build Documentation
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@c7c1c9e8f6c4d783c8cdffc4b4b2412ae23e7db3 # v2.0
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Build the Sphinx documentation
      working-directory: ${{ github.repository }}
      run: make docs-build

  build:
    name: Build Distribution
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Building the package and verify import
      working-directory: ${{ github.repository }}
      run: make build
  minver-tests:
    name: Minimum Version Tests (Python ${{ matrix.python-version }})
    needs: [unit-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@c7c1c9e8f6c4d783c8cdffc4b4b2412ae23e7db3 # v2.0
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Test minimum versions with pytest
      working-directory: ${{ github.repository }}
      run: make minver-tests PYTHON_VERSION=${{ matrix.python-version }}

  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    needs: [unit-tests]
    if: 'true' # Enable/disable integration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@c7c1c9e8f6c4d783c8cdffc4b4b2412ae23e7db3 # v2.0
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Run integration tests with pytest
      working-directory: ${{ github.repository }}
      timeout-minutes: 10
      env:
        ECMWF_DATASTORES_URL: ${{ secrets.ECMWF_DATASTORES_URL }}
        ECMWF_DATASTORES_KEY: ${{ secrets.ECMWF_DATASTORES_KEY }}
        ANONYMOUS_PAT: ${{ secrets.ECMWF_DATASTORES_ANON_KEY }}
      run: make ci-integration-tests PYTHON_VERSION=${{ matrix.python-version }}
