name: On-push

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - upstream
  pull_request:
    branches:
    - main
    - upstream

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@75fdb0e0da447da38574ee14a0849eee160bb2b0 # v1.2
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Run code quality tools
      working-directory: ${{ github.repository }}
      run: make qa

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@75fdb0e0da447da38574ee14a0849eee160bb2b0 # v1.2
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8

    - name: Test the code with pytest
      working-directory: ${{ github.repository }}
      run: make unit-tests PYTHON_VERSION=${{ matrix.python-version }}

  type-check:
    name: Type Check
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@75fdb0e0da447da38574ee14a0849eee160bb2b0 # v1.2
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Static type checking with mypy
      working-directory: ${{ github.repository }}
      run: make type-check

  docs-build:
    name: Build Documentation
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@75fdb0e0da447da38574ee14a0849eee160bb2b0 # v1.2
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Build the Sphinx documentation
      working-directory: ${{ github.repository }}
      run: make docs-build

  build:
    name: Build Distribution
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Building the package and verify import
      working-directory: ${{ github.repository }}
      run: make build
  minver-tests:
    name: Minimum Version Tests (Python ${{ matrix.python-version }})
    needs: [unit-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@75fdb0e0da447da38574ee14a0849eee160bb2b0 # v1.2
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8

    - name: Test minimum versions with pytest
      working-directory: ${{ github.repository }}
      run: make minver-tests PYTHON_VERSION=${{ matrix.python-version }}

  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    needs: [unit-tests]
    if: 'true' # Enable/disable integration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: ${{ github.repository }}
        persist-credentials: false
    - name: Clone internal dependencies
      uses: bopen/ci-cd/git-clone@75fdb0e0da447da38574ee14a0849eee160bb2b0 # v1.2
      with:
        git-pat: ${{ secrets.DSS_GITHUB_PAT }}
        default-repo-ref: ${{ env.TARGET_BRANCH }}
        pyproject-path: ${{ github.repository }}/pyproject.toml
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8

    - name: Run integration tests with pytest
      working-directory: ${{ github.repository }}
      run: make ci-integration-tests PYTHON_VERSION=${{ matrix.python-version }}
